name: Bug
description: Something doesn't work as it should.
labels: ["bug", "needs-decision"]
body:
  - type: markdown
    attributes:
      value: |
        New bugs start as `needs-decision`. Change the status label to `ready` once the expected
        behaviour is clear, or `blocked` if it waits on another issue (CONTRIBUTING.md).
  - type: input
    id: depends
    attributes:
      label: Depends on
      description: Issues that must be closed first, e.g. "#6, #7". Write "none" if there are none.
      value: none
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, step by step, and what went wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Error messages, logs or screenshots
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: |
        One line per criterion: what works → how it's proven (test / running app / database / person).
        A test that reproduces the bug is usually one of them. Mark a criterion that can only be proven
        after deploy with "(after deploy)".
      placeholder: |
        - An empty search no longer crashes → unit test that reproduces the bug
        - The search page shows "No results" → checked in the running app
