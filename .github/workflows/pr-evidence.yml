name: PR evidence

# Its own workflow so that editing the pull request body re-runs only this check, not all of CI.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-evidence:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every acceptance criterion has recorded evidence
        env:
          # Passed as data, never interpolated into the script, so the body can't inject commands.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check_pr_evidence.py
